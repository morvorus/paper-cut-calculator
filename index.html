<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรแกรมคำนวณตัดกระดาษ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --bg: #F5F3EC;
  --grid-line: #E3DFD1;
  --ink: #24262B;
  --ink-soft: #5B5F6A;
  --blue: #2954A3;
  --blue-deep: #17356E;
  --orange: #E8622C;
  --teal: #1E8C7D;
  --paper: #FFFFFF;
  --line: #C9C4B2;
  --radius: 6px;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 24px 24px,
    var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
}

.mono{ font-family:'IBM Plex Mono', monospace; }

.app{
  max-width: 880px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

.masthead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 14px;
  margin-bottom: 22px;
}
.masthead h1{
  font-family:'Space Grotesk', 'IBM Plex Sans Thai', sans-serif;
  font-size: 22px;
  font-weight:700;
  letter-spacing: 0.2px;
  margin:0;
}
.masthead .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--paper);
}

.steps{
  display:flex;
  align-items:center;
  gap: 8px;
  margin-bottom: 22px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  flex-wrap: wrap;
}
.steps .mode-tag{ margin-left: auto; }
.step-pill{
  display:flex;
  align-items:center;
  gap:6px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
}
.step-pill.clickable{ cursor: pointer; transition: border-color .15s, background .15s; }
.step-pill.clickable:hover{ border-color: var(--blue); background: #EAF0FB; }
.step-pill.active{
  border-color: var(--blue);
  color: var(--blue-deep);
  background: #EAF0FB;
  font-weight:600;
}
.step-pill.done{
  color: var(--teal);
  border-color: var(--teal);
}
.step-num{
  width:16px;height:16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;
  background: currentColor;
  color: var(--paper) !important;
}
.step-num span{ color: var(--paper); }

.card{
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 18px;
  position: relative;
}
.card::before{
  content:'';
  position:absolute;
  top:10px; left:10px; right:10px; bottom:10px;
  border: 1px dashed transparent;
  pointer-events:none;
}

.section-title{
  font-family:'Space Grotesk','IBM Plex Sans Thai', sans-serif;
  font-size: 17px;
  font-weight:700;
  margin: 0 0 4px;
}
.section-sub{
  color: var(--ink-soft);
  font-size: 13px;
  margin: 0 0 18px;
}

.preset-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.preset-btn{
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: var(--radius);
  padding: 12px 10px;
  cursor:pointer;
  text-align:left;
  transition: border-color .15s, background .15s, transform .1s;
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
  font:inherit;
  color:inherit;
  text-align:center;
}
.preset-btn:hover{ border-color: var(--blue); transform: translateY(-1px); }
.preset-btn:focus-visible,
.mode-btn:focus-visible,
.unit-opt:focus-visible{
  outline:3px solid rgba(41,84,163,.35);
  outline-offset:2px;
}
.preset-btn.selected{
  border-color: var(--blue);
  background: #EAF0FB;
  box-shadow: inset 0 0 0 1px var(--blue);
}
.preset-icon{
  width: 40px; height: 30px;
  border: 1.5px solid var(--blue-deep);
  border-radius: 2px;
  background: repeating-linear-gradient(45deg, #f0f4fb, #f0f4fb 4px, #e4ecf9 4px, #e4ecf9 8px);
}
.preset-label{
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight:600;
}
.preset-label small{ color: var(--ink-soft); font-weight:400; }
.preset-note{
  align-self: flex-start;
  font-family:'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--teal);
  background: #E8F5F2;
  border-radius: 999px;
  padding: 2px 8px;
}

.custom-toggle{
  border: 1px dashed var(--line);
}
.custom-toggle .preset-icon{ background: none; border-style:dashed; }

.field-row{
  display:flex;
  gap: 14px;
  flex-wrap:wrap;
  align-items:flex-end;
  margin-top: 6px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field label{

}
.field input{
  font-family:'IBM Plex Mono', monospace;
  font-size: 15px;
  padding: 9px 10px;
  border: 1px solid var(--line);

}
.field input:focus{ outline:2px solid var(--blue); outline-offset:1px; background: var(--paper); }
.field .unit{ color: var(--ink-soft); font-size:12px; }
.unit-toggle{

.unit-toggle .unit-opt{

.unit-toggle .unit-opt:not(.active):hover{ background: #EAF0FB; color: var(--blue-deep); }
.access-code-wrap{

.result-warning{

}
.field .fixed-value{

.qty-field{ max-width: 260px; }

.btn{

.btn:active{ transform: translateY(1px); }

.actions{ display:flex; justify-content:space-between; align-items:center; margin-top: 8px; }

.error-msg{

.result-layout{

  grid-template-columns: 1.5fr 1fr;

.diagram-wrap{

.leftover-list{

.stat-card{

.stat-headline{

.breakdown{

.breakdown-row .value{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:16px; }

.qty-box{

  background: #FDF1EA;

.qty-box .headline{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:40px; color: var(--orange); line-height:1.2; }
.qty-box .headline .unit{ font-size:15px; color: var(--ink-soft); font-weight:500; margin-left:6px; }
.qty-box .headline-big{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:24px; color: var(--orange); line-height:1.1; }
.qty-box .headline-big .unit{ font-size:13px; color: var(--ink-soft); font-weight:500; margin-left:6px; }
.qty-box .qty-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; margin-bottom:2px; }
.qty-box .qty-secondary{

.qty-box .sub{ font-size:14px; color: var(--ink-soft); margin-top:14px; }

.size-frame{

  border-radius: var(--radius);

.size-box.big{ border-color: var(--blue); }

.size-box .size-swatch{

.size-box.big .size-swatch{ color: var(--blue); background: #EAF0FB; }

.size-box .size-text .size-label{

.size-box .size-text .size-value{

.size-box .size-text .size-sub{

.size-arrow{

.footer-note{

.mode-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap: 14px;
}
.mode-btn{
  border: 1.5px solid var(--line);
  background: var(--paper);
  border-radius: var(--radius);
  padding: 22px 18px;

.mode-btn-title{

  cursor: pointer;
  transition: background .15s, border-color .15s;

.mode-tag:hover{ background: #DCE7FA; border-color: var(--blue); }

<body>
<div class="app" id="app"></div>

<script>
const MODES = {
  standard: {
    label: 'ขนาดกระดาษมาตรฐาน',
    presets: [
      {w:31, h:43, unit:'นิ้ว'},
      {w:24, h:35, unit:'นิ้ว'},
      {w:25.5, h:35.5, unit:'นิ้ว'},
      {w:25, h:36, unit:'นิ้ว'},
      {w:35, h:47, unit:'นิ้ว'},
    ]
  },
  printshop: {
    label: 'กระดาษโรงพิมพ์',
    presets: [
      {w:24, h:17.5, unit:'นิ้ว'},
      {w:25, h:18, unit:'นิ้ว'},
      {w:15.5, h:21.5, unit:'นิ้ว'},
      {w:25, h:12, unit:'นิ้ว'},
      {w:24, h:11.66, unit:'นิ้ว'},
      {w:74, h:53, unit:'ซม.'},
      {w:30.4, h:44.4, unit:'ซม.', note:'Digital'},
      {w:31.6, h:45.6, unit:'ซม.', note:'Digital'},
      {w:33, h:48.8, unit:'ซม.', note:'Digital'},
    ]
  }
};

const ACCESS_CODE = 'jan';
const UNIT_SCALE = 10; // calculate in 0.1 cm units to avoid floating-point undercounts
const MIN_PIECE_CM = 0.1;
const MAX_SHEET_CM = 500;
const MAX_QTY = 10000000;
const MAX_DP_STATES = 50000;
const MAX_DP_MS = 600;
const MAX_RENDER_CELLS = 2000;
const MAX_MATERIALIZED_REGIONS = 5000;
const MAX_RENDER_SCRAPS = 500;

let state = {
  mode: null,
  step: 1,
  selectedPreset: 0,
  customW: '', customH: '',
  customUnit: 'นิ้ว',
  smallW: '', smallH: '',
  qty: '',
  accessCode: '',
  error: ''
};

function fmt(n){
  if (Number.isInteger(n)) return n.toString();
  return (Math.round(n*100)/100).toString();
}

function inToCm(inch){
  return Math.round((inch*2.54)*100)/100;
}

function toCm(v, unit){
  return unit === 'ซม.' ? v : inToCm(v);
}

function parseFiniteNumber(value){
  const n = Number(value);
  return Number.isFinite(n) ? n : NaN;
}

function roundNumber(value, digits = 2){
  const factor = 10 ** digits;
  return Math.round((value + Number.EPSILON) * factor) / factor;
}

function convertUnitInput(value, fromUnit, toUnit){
  if (value === '' || fromUnit === toUnit) return value;
  const n = parseFiniteNumber(value);
  if (!Number.isFinite(n)) return '';
  return String(roundNumber(fromUnit === 'นิ้ว' ? n * 2.54 : n / 2.54));
}

function hasValidAccessCode(){
  return state.accessCode.trim().toLowerCase() === ACCESS_CODE;
}

function toUnits(cm){
  return Math.round(cm * UNIT_SCALE);
}

function fromUnits(units){
  return units / UNIT_SCALE;
}

function escapeAttr(value){
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function getBigSizeIn(){
  if (state.selectedPreset === -1){
    return { w: parseFloat(state.customW), h: parseFloat(state.customH), unit: state.customUnit };
  }
  const p = MODES[state.mode].presets[state.selectedPreset];
  return { w: p.w, h: p.h, unit: p.unit || 'นิ้ว', note: p.note };
}

function computeBest(W,H,w,h){
  const sheetW = toUnits(W), sheetH = toUnits(H);
  const pieceW = toUnits(w), pieceH = toUnits(h);
  if (sheetW <= 0 || sheetH <= 0 || pieceW <= 0 || pieceH <= 0){
    return { total:0, aCount:0, bCount:0, cells:[], leftovers:[], exact:true, renderLimited:false };
  }

  const memo = new Map();
  const cutMemo = new Map();
  const startedAt = Date.now();
  let statesVisited = 0;
  let budgetExceeded = false;

  function gridResult(rectW, rectH, orient){
    const pw = orient === 'A' ? pieceW : pieceH;
    const ph = orient === 'A' ? pieceH : pieceW;
    const nx = Math.floor(rectW / pw);
    const ny = Math.floor(rectH / ph);
    const count = nx * ny;
    return {
      count,
      aCount: orient === 'A' ? count : 0,
      bCount: orient === 'B' ? count : 0,
      cuts: 0,
      exact: true,
      plan: { type:'grid', orient, pw, ph, nx, ny }
    };
  }

  function prefer(a, b){
    if (b.count !== a.count) return b.count > a.count ? b : a;
    if (b.cuts !== a.cuts) return b.cuts < a.cuts ? b : a;
    return b.aCount >= a.aCount ? b : a;
  }

  function cutPositions(size){
    if (cutMemo.has(size)) return cutMemo.get(size);
    const positions = new Set();
    for (const step of [pieceW, pieceH]){
      for (let cut = step; cut < size; cut += step) positions.add(cut);
    }
    const result = Array.from(positions)
      .sort((a,b) => Math.abs(a-size/2) - Math.abs(b-size/2));
    cutMemo.set(size, result);
    return result;
  }

  function solve(rectW, rectH){
    const key = `${rectW}x${rectH}`;
    if (memo.has(key)) return memo.get(key);

    statesVisited += 1;
    let best = prefer(gridResult(rectW, rectH, 'A'), gridResult(rectW, rectH, 'B'));
    const upperBound = Math.floor((rectW * rectH) / (pieceW * pieceH));
    if (best.count === upperBound){
      memo.set(key, best);
      return best;
    }

    if (statesVisited > MAX_DP_STATES || Date.now() - startedAt > MAX_DP_MS){
      budgetExceeded = true;
      best.exact = false;
      memo.set(key, best);
      return best;
    }

    const budgetBefore = budgetExceeded;
    for (const cut of cutPositions(rectW)){
      const left = solve(cut, rectH);
      const right = solve(rectW-cut, rectH);
      const candidate = {
        count: left.count + right.count,
        aCount: left.aCount + right.aCount,
        bCount: left.bCount + right.bCount,
        cuts: left.cuts + right.cuts + 1,
        exact: left.exact && right.exact,
        plan: { type:'splitV', cut, first:left.plan, second:right.plan }
      };
      best = prefer(best, candidate);
      if (best.count === upperBound) break;
    }

    if (best.count < upperBound){
      for (const cut of cutPositions(rectH)){
        const top = solve(rectW, cut);
        const bottom = solve(rectW, rectH-cut);
        const candidate = {
          count: top.count + bottom.count,
          aCount: top.aCount + bottom.aCount,
          bCount: top.bCount + bottom.bCount,
          cuts: top.cuts + bottom.cuts + 1,
          exact: top.exact && bottom.exact,
          plan: { type:'splitH', cut, first:top.plan, second:bottom.plan }
        };
        best = prefer(best, candidate);
        if (best.count === upperBound) break;
      }
    }

    best.exact = best.count === upperBound || (best.exact && budgetExceeded === budgetBefore);
    memo.set(key, best);
    return best;
  }

  const solved = solve(sheetW, sheetH);
  const cells = [];
  const leftovers = [];
  const renderLimited = solved.count > MAX_RENDER_CELLS;
  let regionsVisited = 0;
  let leftoversLimited = false;
  const pushLeftover = (x,y,rw,rh) => {
    if (rw > 0 && rh > 0){
      if (leftovers.length < MAX_MATERIALIZED_REGIONS) leftovers.push({x,y,w:rw,h:rh});
      else leftoversLimited = true;
    }
  };

  function materialize(plan, x, y, rectW, rectH){
    if (!plan) return;
    regionsVisited += 1;
    if (regionsVisited > MAX_MATERIALIZED_REGIONS){
      leftoversLimited = true;
      return;
    }
    if (plan.type === 'splitV'){
      materialize(plan.first, x, y, plan.cut, rectH);
      materialize(plan.second, x+plan.cut, y, rectW-plan.cut, rectH);
      return;
    }
    if (plan.type === 'splitH'){
      materialize(plan.first, x, y, rectW, plan.cut);
      materialize(plan.second, x, y+plan.cut, rectW, rectH-plan.cut);
      return;
    }

    const usedW = plan.nx * plan.pw;
    const usedH = plan.ny * plan.ph;
    if (!renderLimited){
      for (let row=0; row<plan.ny; row++){
        for (let col=0; col<plan.nx; col++){
          cells.push({
            x: fromUnits(x + col*plan.pw),
            y: fromUnits(y + row*plan.ph),
            w: fromUnits(plan.pw),
            h: fromUnits(plan.ph),
            orient: plan.orient
          });
        }
      }
    }
    pushLeftover(x+usedW, y, rectW-usedW, rectH);
    pushLeftover(x, y+usedH, usedW, rectH-usedH);
  }

  materialize(solved.plan, 0, 0, sheetW, sheetH);
  return {
    total: solved.count,
    aCount: solved.aCount,
    bCount: solved.bCount,
    cells,
    leftovers: mergeAdjacentRects(leftovers)
      .map(r => ({x:fromUnits(r.x), y:fromUnits(r.y), w:fromUnits(r.w), h:fromUnits(r.h)})),
    exact: solved.exact && !budgetExceeded,
    renderLimited,
    leftoversLimited,
    statesVisited
  };
}

function mergeAdjacentRects(rects){
  if (rects.length > MAX_RENDER_SCRAPS) return rects;
  const merged = rects.map(r => ({...r}));
  let changed = true;
  while (changed){
    changed = false;
    outer: for (let i=0; i<merged.length; i++){
      for (let j=i+1; j<merged.length; j++){
        const a = merged[i], b = merged[j];
        if (a.y === b.y && a.h === b.h && (a.x+a.w === b.x || b.x+b.w === a.x)){
          merged[i] = {x:Math.min(a.x,b.x), y:a.y, w:a.w+b.w, h:a.h};
        } else if (a.x === b.x && a.w === b.w && (a.y+a.h === b.y || b.y+b.h === a.y)){
          merged[i] = {x:a.x, y:Math.min(a.y,b.y), w:a.w, h:a.h+b.h};
        } else {
          continue;
        }
        merged.splice(j,1);
        changed = true;
        break outer;
      }
    }
  }
  return merged;
}

function leftoverRectLabel(r, W, H){
  // One clear positional name for a leftover rectangle, based on where its
  // center sits within the sheet.
  const cx = r.x + r.w/2;
  const cy = r.y + r.h/2;
  const leftBand = cx < W/3;
  const rightBand = cx > W*2/3;
  const topBand = cy < H/3;
  const bottomBand = cy > H*2/3;

  if (bottomBand && leftBand) return 'มุมล่างซ้าย';
  if (bottomBand && rightBand) return 'มุมล่างขวา';
  if (topBand && leftBand) return 'มุมบนซ้าย';
  if (topBand && rightBand) return 'มุมบนขวา';
  if (bottomBand) return 'ด้านล่าง';
  if (topBand) return 'ด้านบน';
  if (rightBand) return 'ด้านขวา';
  if (leftBand) return 'ด้านซ้าย';
  return 'ตรงกลาง';
}

function isNegligibleScrap(r){
  // Ignore slivers under 0.5 cm on either side (rounding/kerf noise, not usable scrap).
  return r.w < 0.5 || r.h < 0.5;
}

function leftoverRectText(r){
  const fmtV = v => fmt(Math.round(v*10)/10);
  return `${fmtV(r.w)} × ${fmtV(r.h)} ซม.`;
}


function orientLabel(orient, w, h){
  // orient 'A' means piece placed as (w wide, h tall) as entered; 'B' means rotated 90deg
  const pw = orient === 'A' ? w : h;
  const ph = orient === 'A' ? h : w;
  const isLandscape = pw >= ph;
  return {
    text: isLandscape ? 'แนวนอน' : 'แนวตั้ง',
    pw, ph
  };
}

function render(){
  const app = document.getElementById('app');
  try {
    renderInner(app);
  } catch (e) {
    try { console.error('paper-cut calculator: render failed', e); } catch(_e){}
    app.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="section-title">เกิดข้อผิดพลาด</div>
      <div class="section-sub">ขออภัย หน้านี้โหลดไม่สำเร็จ กรุณากดปุ่มด้านล่างเพื่อเริ่มใหม่ หรือรีเฟรชหน้าเว็บ</div>
      <div class="actions" style="margin-top:20px;"><button class="btn btn-primary" id="global-err-restart">เริ่มใหม่</button></div>
    `;

function renderInner(app){

  `;

    renderModeSelect(app);
    const note = document.createElement('div');
    note.className = 'footer-note';
    note.textContent = 'คำนวณจากการตัดแบบกิโยติน (guillotine cut) ไม่รวมระยะเผื่อตัด (bleed) หรือระยะขอบจับเครื่องพิมพ์';
    app.appendChild(note);

  }

  const steps = document.createElement('div');

  steps.innerHTML = `
    <div class="step-pill ${state.step===1?'active':'done'}" id="step-pill-1">

    </div>

  `;

  steps.querySelector('#mode-tag-btn').addEventListener('click', () => {
    state.mode = null;
    render();
  });
  for (let n = 1; n <= 3; n++){
    const pill = steps.querySelector(`#step-pill-${n}`);
    if (n <= state.step){
      pill.classList.add('clickable');

        state.step = n;
        render();
      });

  if (state.step === 2) renderStep2(app);

}

      <div class="actions" style="margin-top:20px;">
        <button class="btn btn-ghost" id="back-code">← ย้อนกลับ</button>
        <button class="btn btn-ghost" id="restart3">เริ่มใหม่</button>
      </div>
    `;
    app.appendChild(card);
    card.querySelector('#back-code').addEventListener('click', () => { state.step = 1; render(); });
    card.querySelector('#restart3').addEventListener('click', resetCalculator);
    return;
  }

  let best;
  try {
    best = computeBest(W, H, w, h);
  } catch (e) {
    renderStep3Error(app, e);
    return;
  }

  if (best.total === 0){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="section-title">ไม่สามารถตัดได้</div>
      <div class="section-sub">กระดาษแผ่นใหญ่ ${fmt(sIn.w)} × ${fmt(sIn.h)} ${sIn.unit} เล็กเกินไปสำหรับกระดาษแผ่นเล็ก ${fmt(w)} × ${fmt(h)} ซม.</div>
      <div class="actions" style="margin-top:20px;">
        <button class="btn btn-ghost" id="back3">← ย้อนกลับ</button>
        <span></span>
      </div>
    `;
    app.appendChild(card);
    card.querySelector('#back3').addEventListener('click', () => { state.step = 2; render(); });
    return;
  }

  try {

  const aInfo = best.aCount > 0 ? orientLabel('A', w, h) : null;
  const bInfo = best.bCount > 0 ? orientLabel('B', w, h) : null;

  const card = document.createElement('div');
  card.className = 'card';

  const sizeFrame = document.createElement('div');
  sizeFrame.className = 'size-frame';
  sizeFrame.innerHTML = `
    <div class="size-box big">
      <div class="size-swatch"></div>
      <div class="size-text">
        <div class="size-label">กระดาษแผ่นใหญ่</div>
        <div class="size-value">${fmt(sIn.w)} × ${fmt(sIn.h)} ${sIn.unit}</div>
        ${sIn.unit !== 'ซม.' ? `<div class="size-sub mono">≈ ${fmt(W)} × ${fmt(H)} ซม.</div>` : ''}
      </div>
    </div>
    <div class="size-arrow">✂</div>
    <div class="size-box small">
      <div class="size-swatch" style="width:20px;height:20px;align-self:center;"></div>
      <div class="size-text">
        <div class="size-label">กระดาษแผ่นเล็ก</div>
        <div class="size-value">${fmt(w)} × ${fmt(h)} ซม.</div>
      </div>
    </div>
  `;
  card.appendChild(sizeFrame);

  const layout = document.createElement('div');
  layout.className = 'result-layout';

  const leftoverRects = best.leftovers;
  const renderedLeftovers = leftoverRects.slice(0, MAX_RENDER_SCRAPS);

  // ---- Diagram column ----
  const diagramWrap = document.createElement('div');
  diagramWrap.className = 'diagram-wrap';
  diagramWrap.innerHTML = `<div class="section-title" style="align-self:flex-start;">แผนผังการตัด</div>`;
  const svgHolder = document.createElement('div');
  svgHolder.innerHTML = buildSVG(
    W, H, best.cells,
    best.renderLimited ? 'แผนผังแบบย่อ' : null,
    '#2954A3', renderedLeftovers
  );
  diagramWrap.appendChild(svgHolder);

  const realLeftovers = leftoverRects.filter(r => !isNegligibleScrap(r));

  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `
    ${aInfo ? `<div class="legend-item"><span class="swatch" style="background:#2954A3;"></span> ${aInfo.text} (${fmt(aInfo.pw)}×${fmt(aInfo.ph)} ซม.)</div>` : ''}
    ${bInfo ? `<div class="legend-item"><span class="swatch" style="background:#1E8C7D;"></span> ${bInfo.text} (${fmt(bInfo.pw)}×${fmt(bInfo.ph)} ซม.)</div>` : ''}
    ${realLeftovers.length ? `<div class="legend-item"><span class="swatch" style="background:#C0392B;"></span> เศษกระดาษ</div>` : ''}
  `;
  diagramWrap.appendChild(legend);
  const caption = document.createElement('div');
  caption.className = 'diagram-caption';
  caption.textContent = best.renderLimited || best.leftoversLimited
    ? 'จำนวนชิ้นมาก จึงแสดงแผนผังแบบย่อเพื่อให้หน้าเว็บทำงานได้ลื่นไหล'
    : `เส้นประคือแนวตัด · ตัวเลขในแต่ละช่องคือขนาดกระดาษแผ่นเล็ก (ซม.)${realLeftovers.length ? ' · สีแดงคือเศษกระดาษ' : ''}`;
  diagramWrap.appendChild(caption);

  if (realLeftovers.length){
    const leftoverList = document.createElement('div');
    leftoverList.className = 'leftover-list';
    leftoverList.innerHTML = realLeftovers.slice(0,20)
      .map(r => `<div class="leftover-item"><span class="leftover-dot"></span>${leftoverRectLabel(r, W, H)} เศษ <b>${leftoverRectText(r)}</b></div>`)
      .join('') + (realLeftovers.length > 20 ? `<div class="diagram-caption">และเศษย่อยอีก ${realLeftovers.length-20} ส่วน</div>` : '');
    diagramWrap.appendChild(leftoverList);
  }

  layout.appendChild(diagramWrap);

  // ---- Stats column ----
  const statCol = document.createElement('div');

  const statCard = document.createElement('div');
  statCard.className = 'stat-card';
  statCard.innerHTML = `
    <div class="stat-sub">ตัดได้ทั้งหมด</div>
    <div class="stat-headline">${best.total}<span class="unit">ตัวต่อ 1 แผ่นใหญ่</span></div>
    <div class="breakdown">
       ${aInfo ? `<div class="breakdown-row">
         <div class="label"><span class="swatch" style="background:#2954A3;"></span>${aInfo.text}</div>
         <div class="value">${best.aCount} ตัว</div>
       </div>` : ''}
       ${bInfo ? `
       <div class="breakdown-row">
         <div class="label"><span class="swatch" style="background:#1E8C7D;"></span>${bInfo.text}</div>
         <div class="value">${best.bCount} ตัว</div>
       </div>` : ''}
    </div>
  `;
  statCol.appendChild(statCard);

  if (state.qty && Number(state.qty) > 0){
    const qty = Number(state.qty);
    const sheetsNeeded = Math.ceil(qty / best.total);
    const leftover = sheetsNeeded*best.total - qty;
    const qtyBox = document.createElement('div');
    qtyBox.className = 'qty-box';
    qtyBox.innerHTML = `
      <div class="qty-primary">
        <div class="qty-label">ต้องใช้กระดาษแผ่นใหญ่</div>
        <div class="headline">${sheetsNeeded}<span class="unit">แผ่น</span></div>
      </div>
      <div class="qty-secondary">
        <div class="qty-label">แผ่นเล็กที่ต้องการทั้งหมด</div>
        <div class="headline-big">${qty}<span class="unit">แผ่น</span></div>
      </div>
      <div class="sub">${qty} (ที่ต้องการ) ÷ ${best.total} (ตัดได้ต่อแผ่น) = ${sheetsNeeded} แผ่นใหญ่ ${leftover>0 ? `(ได้ส่วนเกิน ${leftover} แผ่นเล็ก)` : '(พอดี ไม่มีเหลือ)'}</div>
    `;
    statCard.appendChild(qtyBox);
  }

  if (!best.exact){
    const warning = document.createElement('div');
    warning.className = 'result-warning';
    warning.textContent = 'รูปแบบนี้มีความซับซ้อนสูง ระบบแสดงผลลัพธ์ที่ดีที่สุดที่พบภายในขีดจำกัดความปลอดภัย';
    statCol.appendChild(warning);
  }

  layout.appendChild(statCol);
  card.appendChild(layout);

  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.style.marginTop = '20px';
  actions.innerHTML = `
    <button class="btn btn-ghost" id="back3">← แก้ไขขนาดกระดาษเล็ก</button>
    <button class="btn btn-ghost" id="restart3">เริ่มใหม่</button>
  `;
  card.appendChild(actions);

  app.appendChild(card);

  card.querySelector('#back3').addEventListener('click', () => { state.step = 2; render(); });
  card.querySelector('#restart3').addEventListener('click', resetCalculator);

  } catch (e) {
    renderStep3Error(app, e);
  }
}

// Fallback shown instead of leaving the results step blank if anything unexpected
// goes wrong while computing/drawing the cut plan (unusual input combos, an
// unsupported browser API, etc.) — so the user always sees *something* actionable
// rather than an empty page, on any device.
function renderStep3Error(app, err){
  try { console.error('paper-cut calculator: renderStep3 failed', err); } catch(_e){}
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="section-title">เกิดข้อผิดพลาดในการคำนวณ</div>
    <div class="section-sub">ขออภัย ระบบไม่สามารถแสดงผลลัพธ์ได้ในขณะนี้ กรุณาลองตรวจสอบขนาดที่กรอกอีกครั้ง หรือกดปุ่มด้านล่างเพื่อย้อนกลับ / เริ่มใหม่</div>
    <div class="actions" style="margin-top:20px;">
      <button class="btn btn-ghost" id="err3-back">← ย้อนกลับ</button>
      <button class="btn btn-ghost" id="err3-restart">เริ่มใหม่</button>
    </div>
  `;
  app.appendChild(card);
  card.querySelector('#err3-back').addEventListener('click', () => { state.step = 2; render(); });
  card.querySelector('#err3-restart').addEventListener('click', resetCalculator);
}

function resetCalculator(){
  state = {
    mode:null, step:1, selectedPreset:0,
    customW:'', customH:'', customUnit:'นิ้ว',
    smallW:'', smallH:'', qty:'', accessCode:'', error:''
  };
  render();
}

function buildSVG(W, H, cells, watermark, watermarkColor, leftoverRects){
  const maxW = 520, maxH = 420;
  const margin = 30;
  const scale = Math.min((maxW-margin)/W, (maxH-margin)/H);
  const plotW = W*scale, plotH = H*scale;
  const totalW = plotW + margin;
  const totalH = plotH + margin;

  let ticksTop = '', ticksLeft = '';
  for(let x=0; x<=W; x += (W>60?10:5)){
    const px = margin + x*scale;
    ticksTop += `<line x1="${px}" y1="${margin-6}" x2="${px}" y2="${margin}" stroke="#5B5F6A" stroke-width="1"/>`;
    ticksTop += `<text x="${px}" y="${margin-10}" font-size="9" font-family="IBM Plex Mono, monospace" fill="#5B5F6A" text-anchor="middle">${x}</text>`;
  }
  for(let y=0; y<=H; y += (H>60?10:5)){
    const py = margin + y*scale;
    ticksLeft += `<line x1="${margin-6}" y1="${py}" x2="${margin}" y2="${py}" stroke="#5B5F6A" stroke-width="1"/>`;
    ticksLeft += `<text x="${margin-9}" y="${py+3}" font-size="9" font-family="IBM Plex Mono, monospace" fill="#5B5F6A" text-anchor="end">${y}</text>`;
  }

  let watermarkSvg = '';
  if (watermark){
    const wmSize = Math.min(plotW, plotH) * 0.22;
    watermarkSvg = `<text x="${margin+plotW/2}" y="${margin+plotH/2}" font-size="${wmSize}" font-family="IBM Plex Sans Thai, sans-serif" font-weight="700" fill="${watermarkColor||'#24262B'}" fill-opacity="0.14" text-anchor="middle" dominant-baseline="middle">${watermark}</text>`;
  }

  let leftoverSvg = '';
  (leftoverRects || []).forEach(r => {
    if (isNegligibleScrap(r)) return;
    const rnd = v => fmt(Math.round(v*10)/10);
    const inset = 1.5;
    const rawX = margin + r.x*scale;
    const rawY = margin + r.y*scale;
    const rawW = r.w*scale;
    const rawH = r.h*scale;
    const x = rawX + inset;
    const y = rawY + inset;
    const w = Math.max(0, rawW - inset*2);
    const h = Math.max(0, rawH - inset*2);
    if (w<=0 || h<=0) return;
    leftoverSvg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F5B7B1" stroke="#922B21" stroke-width="1.5"/>`;

    const pad = 5;
    if (w>26 && h>14){
      const fs = Math.max(7, Math.min(10, Math.min(w,h)/3.2));
      leftoverSvg += `<text x="${x+pad}" y="${y+h/2}" font-size="${fs}" font-weight="700" font-family="IBM Plex Mono, monospace" fill="#5C1A14" text-anchor="start" dominant-baseline="middle">${rnd(r.h)} cm</text>`;
      leftoverSvg += `<text x="${x+w/2}" y="${y+h-pad}" font-size="${fs}" font-weight="700" font-family="IBM Plex Mono, monospace" fill="#5C1A14" text-anchor="middle" dominant-baseline="text-after-edge">${rnd(r.w)} cm</text>`;
    } else if (h > w*1.8 && h>26){
      // narrow tall strip — rotate the single dimension that fits
      const fs = Math.max(8, Math.min(11, w/1.4));
      const cx = x+w/2, cy = y+h/2;
      leftoverSvg += `<text x="${cx}" y="${cy}" font-size="${fs}" font-weight="700" font-family="IBM Plex Mono, monospace" fill="#5C1A14" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 ${cx} ${cy})">${rnd(r.w)} cm</text>`;
    }
  });

  let pieces = '';
  cells.forEach((c, idx) => {
    const x = margin + c.x*scale;
    const y = margin + c.y*scale;
    const w = c.w*scale;
    const h = c.h*scale;
    const color = c.orient === 'A' ? '#2954A3' : '#1E8C7D';
    const fill = c.orient === 'A' ? '#EAF0FB' : '#E8F5F2';
    pieces += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    // crop marks at corners
    const m = 6;
    [[x,y,-1,-1],[x+w,y,1,-1],[x,y+h,-1,1],[x+w,y+h,1,1]].forEach(([cx,cy,dx,dy]) => {
      pieces += `<line x1="${cx}" y1="${cy}" x2="${cx+dx*m}" y2="${cy}" stroke="${color}" stroke-width="1"/>`;
      pieces += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy+dy*m}" stroke="${color}" stroke-width="1"/>`;
    });
    if (w>20 && h>20){
      const fontSize = Math.max(7, Math.min(11, Math.min(w,h)/5));
      const pad = 5;
      pieces += `<text x="${x+pad}" y="${y+h/2}" font-size="${fontSize}" font-family="IBM Plex Mono, monospace" fill="${color}" text-anchor="start" dominant-baseline="middle">${fmt(c.h)} cm</text>`;
      pieces += `<text x="${x+w/2}" y="${y+h-pad}" font-size="${fontSize}" font-family="IBM Plex Mono, monospace" fill="${color}" text-anchor="middle" dominant-baseline="text-after-edge">${fmt(c.w)} cm</text>`;
    }
  });

  return `
    <svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" xmlns="http://www.w3.org/2000/svg">
      <rect x="${margin}" y="${margin}" width="${plotW}" height="${plotH}" fill="#FFFFFF" stroke="#24262B" stroke-width="2"/>
      ${ticksTop}
      ${ticksLeft}
      ${watermarkSvg}
      ${leftoverSvg}
      ${pieces}
    </svg>
  `;
}

render();
</script>
</body>
</html>
